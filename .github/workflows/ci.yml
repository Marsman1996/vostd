name: Format and Verify VOSTD (Main)

# Unified CI: one verification run feeds everything.
#
#  - push to main: verify (matrix) + format; when perf-relevant paths changed
#    (see the `changes` job), record the verification cost to the gh-pages
#    benchmark history; build and deploy docs on every push.
#  - pull_request: verify (matrix) + format + doc build (no deploy).
#  - PR comment `/verify-perf` (OWNER/MEMBER/COLLABORATOR): verify the PR's
#    merge ref once on Linux, compare its cost against the last recorded main
#    measurement, post the diff as a PR comment. macOS/format/doc are skipped;
#    gh-pages is never written.
#  - workflow_dispatch: full run (verify, perf record, doc deploy).
#
# The Ubuntu verify leg runs with -- --time-expanded and uploads its log plus
# the built Verus toolchain and workspace target directory as run artifacts:
# the `perf` job parses that log instead of re-verifying, and the `doc` job
# consumes the artifacts instead of re-bootstrapping Verus.
#
# Replaces the former ci.yml + verify-perf.yml + doc.yml (including the
# doc.yml -> verify-perf `workflow_run` chain).

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # push: per-branch; PR: per-PR. issue_comment: github.ref is the default
  # branch for comment events, so the issue number keeps different PRs' runs
  # from cancelling each other (and keeps comment runs disjoint from the PR's
  # own push runs).
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.issue.number || 'push' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  changes:
    # Emulates the former verify-perf push `paths` filter: only pushes whose
    # diff touches verification-relevant paths record perf measurements.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matched: ${{ steps.diff.outputs.matched }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Check whether perf-relevant paths changed
        id: diff
        run: |
          BEFORE="${{ github.event.before }}"
          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
            echo "No baseline commit (new branch or force push); treating all paths as changed."
            echo "matched=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! git fetch --no-tags --depth=1 origin "$BEFORE"; then
            echo "Failed to fetch the baseline commit; treating all paths as changed."
            echo "matched=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CHANGED=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          echo "Changed files since $BEFORE:"
          echo "$CHANGED"
          if echo "$CHANGED" | grep -Fx -e '.github/workflows/ci.yml' -e 'tools/verus_perf.py' \
              -e 'dv' -e 'Cargo.toml' -e 'Cargo.lock' -e 'rust-toolchain.toml' \
            || echo "$CHANGED" | grep -Eq '^ostd/' \
            || echo "$CHANGED" | grep -Eq '^verified_libs/vstd_extra/'; then
            echo "matched=true" >> "$GITHUB_OUTPUT"
          else
            echo "matched=false" >> "$GITHUB_OUTPUT"
          fi

  format-and-verify:
    # Ubuntu: runs on every event (also comment runs, for the measurement).
    # macOS: skipped on comment runs, as the former verify-perf was
    # Linux-only there.
    if: >
      github.event_name != 'issue_comment' ||
      (matrix.os == 'ubuntu-24.04' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/verify-perf') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      statuses: write   # pending ci/verify-perf status on comment runs
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
    timeout-minutes: 240
    steps:
      - name: Get PR head commit
        id: pr
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.issue.number;
            const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number });

            core.setOutput('head_sha', pull.head.sha);

      - name: Mark verify-perf as pending
        if: github.event_name == 'issue_comment'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: '${{ steps.pr.outputs.head_sha }}',
              state: 'pending',
              context: 'ci/verify-perf',
              description: 'verify-perf comparison is running',
              target_url: runUrl,
            });

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # push: the pushed commit. issue_comment: the PR's merge ref.
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/merge', github.event.issue.number) || github.sha }}
          submodules: recursive

      - name: Set up toolchain and caches
        uses: ./.github/actions/setup-verus
        with:
          verus: 'true'
          install-verusfmt: 'false'

      # Same verification as plain `make` (cargo dv verify --targets ostd),
      # with --time-expanded appended so this ONE run feeds the warnings
      # check, the perf job's cost metrics, and the documentation build.
      - name: Run verification
        run: |
          set -o pipefail
          if ! cargo dv verify --targets ostd -- --time-expanded 2>&1 | tee verify_output.txt; then
            echo "❌ Verification failed"
            echo "VERIFY_FAILED=1" >> "$GITHUB_ENV"
            exit 1
          else
            echo "✅ Verification passed!"
          fi

      - name: Check for verification warnings
        if: always() && runner.os == 'Linux'
        run: |
          WARNINGS=(
            "note: automatically chose triggers for this expression:|auto-trigger notes"
            "warning: use of deprecated method \`vstd::set::Set::<A>::finite\`|deprecated Set::finite()"
            "warning: use of deprecated associated function \`vstd::set::Set::<A>::new_assuming_finite\`|deprecated Set::new_assuming_finite()"
          )

          FAILED=0
          for ITEM in "${WARNINGS[@]}"; do
            PATTERN="${ITEM%%|*}"
            LABEL="${ITEM##*|}"
            if grep -q "$PATTERN" verify_output.txt 2>/dev/null; then
              echo "❌ Found $LABEL"
              grep -n "$PATTERN" verify_output.txt
              FAILED=1
            else
              echo "✅ No $LABEL found"
            fi
          done

          if [[ "$FAILED" == "1" ]]; then
            echo "VERIFY_WARNINGS_FOUND=1" >> "$GITHUB_ENV"
            exit 1
          fi

      - name: Upload verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-log-${{ matrix.os }}
          path: verify_output.txt
          retention-days: 7
          if-no-files-found: warn

      # Pass the built Verus toolchain (pruned) and the workspace target
      # directory to the `doc` job: one upload rooted at the workspace means
      # both unpack in place on download. Comment runs skip this: they never
      # build docs.
      - name: Upload Verus and workspace build artifacts
        if: always() && matrix.os == 'ubuntu-24.04' && github.event_name != 'issue_comment'
        uses: actions/upload-artifact@v4
        with:
          name: verify-artifacts-ubuntu
          path: |
            tools/verus
            !tools/verus/.git
            !tools/verus/.git/**
            !tools/verus/source/target
            !tools/verus/source/target/**
            target/x86_64-unknown-none
          retention-days: 1
          if-no-files-found: warn

      - name: Publish summary
        if: always()
        run: |
          {
            echo "# CI Summary (${{ matrix.os }})"
            if [[ "${VERIFY_FAILED:-0}" == "1" ]]; then
              echo "- Verification: ❌ failed"
            else
              echo "- Verification: ✅ passed"
            fi
            if [[ "${VERIFY_WARNINGS_FOUND:-0}" == "1" ]]; then
              echo "- Verification warnings: ❌ found"
            else
              echo "- Verification warnings: ✅ none"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  format:
    # Formatting does not need a Verus bootstrap: only the Rust toolchain,
    # rust-dv (older runs of `cargo dv fmt`), verusfmt, and the Verus SOURCES
    # (the root workspace's vstd path dependency must exist for cargo
    # metadata, but is never compiled here).
    if: github.event_name != 'issue_comment'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up toolchain and caches
        uses: ./.github/actions/setup-verus
        with:
          verus: 'false'
          install-verusfmt: 'true'

      - name: Fetch Verus sources for the vstd path dependency
        run: |
          VERUS_COMMIT=$(git ls-remote https://github.com/asterinas/verus HEAD | cut -f1)
          # --strip-components=1 drops the tarball's <repo>-<ref> root
          # directory regardless of its exact name.
          mkdir -p tools/verus
          curl -Ls "https://github.com/asterinas/verus/archive/${VERUS_COMMIT}.tar.gz" | tar xz -C tools/verus --strip-components=1
          test -f tools/verus/source/vstd/Cargo.toml

      - name: Run format
        run: make fmt

      - name: Check for formatting changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "Code is not properly formatted. Run 'make fmt'."
            git diff
            echo "FMT_FAILED=1" >> "$GITHUB_ENV"
            exit 1
          fi

      - name: Publish summary
        if: always()
        run: |
          {
            echo "# Format Summary"
            if [[ "${FMT_FAILED:-0}" == "1" ]]; then
              echo "- Formatting: ❌ failed"
            else
              echo "- Formatting: ✅ passed"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  perf:
    name: verify-perf
    needs: [format-and-verify, changes]
    # Records the verification cost of the SINGLE verification run from the
    # ubuntu verify leg (never re-verifies):
    #  - push (perf-relevant paths changed): record + compare + append to the
    #    gh-pages benchmark history.
    #  - PR comment /verify-perf: compare the merge ref against the last
    #    recorded main measurement and post the diff as a PR comment; never
    #    writes to gh-pages.
    #  - workflow_dispatch: full record.
    # `always()` so a failed verification still reports the failure status.
    if: >
      always() &&
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'issue_comment' ||
       (github.event_name == 'push' && needs.changes.outputs.matched == 'true')) &&
      (github.event_name != 'issue_comment' ||
       (github.event.issue.pull_request &&
        contains(github.event.comment.body, '/verify-perf') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)))
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # push benchmark history to the gh-pages branch
      pull-requests: write # post /verify-perf comparison as a PR comment
      deployments: write   # github-action-benchmark gh-pages deployment
      statuses: write      # ci/verify-perf commit status on PR head commits
    timeout-minutes: 30
    steps:
      - name: Get PR head commit
        id: pr
        if: github.event_name == 'issue_comment'
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.issue.number;
            const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number });

            core.setOutput('head_sha', pull.head.sha);

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'issue_comment' && format('refs/pull/{0}/merge', github.event.issue.number) || github.sha }}

      - name: Record which commit was checked out
        run: echo "CUR_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      # On push, the cache key is perf-metrics-<sha> (records the measurement
      # for the next run). On a PR comment the key is a throwaway
      # perf-prtmp-<comment-id> so this run's PR metrics are never read back
      # as a baseline; the `restore-keys` prefix still finds the last recorded
      # main measurement to compare against.
      - name: Restore prior measurement (baseline)
        id: baseline
        uses: actions/cache/restore@v6
        with:
          path: perf-store
          key: ${{ github.event_name == 'issue_comment' && format('perf-prtmp-{0}', github.event.comment.id) || format('perf-metrics-{0}', github.sha) }}
          restore-keys: |
            perf-metrics-

      - name: Save aside the baseline (if any)
        run: |
          if [[ -f perf-store/metrics.json ]]; then
            BASELINE_SHA=$(cat perf-store/source-sha.txt 2>/dev/null || echo unknown)
            echo "BASELINE_SHA=$BASELINE_SHA" >> "$GITHUB_ENV"
            mv perf-store/metrics.json perf-baseline.json
            echo "Baseline: $BASELINE_SHA"
          else
            echo "No prior measurement cached; nothing to compare against yet."
          fi

      - name: Download verification log
        uses: actions/download-artifact@v4
        with:
          name: verify-log-ubuntu-24.04

      - name: Parse cost metrics
        run: |
          mkdir -p perf-store
          python3 tools/verus_perf.py parse verify_output.txt > perf-store/metrics.json
          echo "$CUR_SHA" > perf-store/source-sha.txt
          echo "recorded run for: $CUR_SHA"
          cat perf-store/metrics.json

      - name: Compare against the prior measurement
        run: |
          mkdir -p out
          if [[ -f perf-baseline.json ]]; then
            if [[ "${{ github.event_name }}" == "issue_comment" ]]; then
              HEADER="PR \`/verify-perf\`: this PR's merge ref (\`$CUR_SHA\`) vs last recorded main (\`${BASELINE_SHA:-unknown}\`)."
            else
              HEADER="Comparing this push (\`$CUR_SHA\`) against the prior measurement (\`${BASELINE_SHA:-unknown}\`)."
            fi
            {
              echo "## Verification cost"
              echo
              echo "$HEADER"
              echo
              python3 tools/verus_perf.py compare perf-baseline.json perf-store/metrics.json
            } > out/perf-report.md
          else
            {
              echo "## Verification cost: first recorded baseline"
              echo
              if [[ "${{ github.event_name }}" == "issue_comment" ]]; then
                echo "No prior main measurement is cached yet (run \`verify-perf\` on main once first), so nothing to compare against. Recording this PR's cost (\`$CUR_SHA\`):"
              else
                echo "No prior measurement was cached. This run (\`$CUR_SHA\`) records the baseline; the next push will compare against it."
              fi
              echo
              echo '```'
              cat perf-store/metrics.json
              echo '```'
            } > out/perf-report.md
          fi
          cat out/perf-report.md
          {
            cat out/perf-report.md
          } >> "$GITHUB_STEP_SUMMARY"

      # Guard against recording a truncated log (e.g. a failed run whose log
      # has no verification results at all) as fake zero-cost benchmarks.
      - name: Convert metrics to benchmark format
        if: github.event_name != 'issue_comment' && needs.format-and-verify.result == 'success'
        run: |
          mkdir -p out
          python3 tools/verus_perf.py to-bm perf-store/metrics.json -o out/benchmark.json
          cat out/benchmark.json

      - name: Record benchmark on gh-pages
        if: github.event_name != 'issue_comment' && needs.format-and-verify.result == 'success'
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: verify-perf
          tool: customSmallerIsBetter
          output-file-path: out/benchmark.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          alert-threshold: '120%'
          comment-on-alert: true
          summary-always: true

      - name: Save measurement as the next baseline
        # Replaces the former post-step cache save. Miss-guarded so a
        # re-run of the same sha does not collide with its own entry.
        if: >
          github.event_name != 'issue_comment' &&
          needs.format-and-verify.result == 'success' &&
          steps.baseline.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: perf-store
          key: ${{ format('perf-metrics-{0}', github.sha) }}

      - name: Comment the report on the PR
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.issue.number }}" --body-file out/perf-report.md

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-perf-${{ github.run_id }}
          path: |
            out/perf-report.md
            out/benchmark.json
            perf-store/metrics.json
            perf-baseline.json
          if-no-files-found: ignore

      - name: Report verify-perf status
        if: always() && github.event_name == 'issue_comment'
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          retries: 3
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const ok = '${{ job.status }}' === 'success';
            const state = ok ? 'success' : 'failure';
            const description = ok
              ? 'verify-perf comparison posted'
              : 'verify-perf run failed';

            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: '${{ steps.pr.outputs.head_sha }}',
              state,
              context: 'ci/verify-perf',
              description,
              target_url: runUrl,
            });

  doc:
    # Builds the documentation from the verify job's artifacts (no second
    # Verus bootstrap, no second `cargo dv build`). Push/dispatch runs deploy
    # via `deploy-gh-pages`; PR runs build only. Runs after `perf` so that, on
    # pushes, the fresh benchmark history is already on gh-pages when we embed
    # it into the doc artifact.
    needs: [format-and-verify, perf]
    if: >
      always() &&
      github.event_name != 'issue_comment' &&
      (github.event_name == 'pull_request' ||
       needs.perf.result == 'success' ||
       needs.perf.result == 'skipped') &&
      (github.event_name == 'pull_request' ||
       needs.format-and-verify.result == 'success')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write      # deploy to GitHub Pages
      id-token: write   # deploy to GitHub Pages
      statuses: write   # ci/doc commit status
    timeout-minutes: 90
    steps:
      - name: Mark doc CI as pending
        if: github.event_name == 'push'
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          STATUS_SHA: ${{ github.sha }}
        with:
          retries: 3
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: process.env.STATUS_SHA,
              state: 'pending',
              context: 'ci/doc',
              description: 'Docs build is running',
              target_url: runUrl,
            });

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up toolchain and caches
        uses: ./.github/actions/setup-verus
        with:
          verus: 'false'
          dv-cache: 'restore'

      - name: Download Verus and workspace build artifacts
        uses: actions/download-artifact@v4
        with:
          name: verify-artifacts-ubuntu

      - name: Sanity-check the restored toolchain
        run: |
          test -x tools/verus/source/target-verus/release/cargo-verus
          test -f tools/verus/source/z3
          test -x tools/verus/source/target-verus/release/verusdoc
          test -d target/x86_64-unknown-none/release

      - name: Build docs
        run: make doc

      # Pull the benchmark history (perf pushes it to the gh-pages branch on
      # push runs) into the rustdoc artifact so the chart is served at
      # <site>/dev/bench/. PRs embed whatever is currently on gh-pages.
      - name: Embed verify-perf benchmark into the doc artifact
        run: |
          set -e
          if ! git fetch --depth=1 origin gh-pages 2>/dev/null; then
            echo "no gh-pages branch yet; benchmark not embedded"
            exit 0
          fi
          git checkout FETCH_HEAD -- dev/bench || { echo "no dev/bench on gh-pages; skipping"; exit 0; }
          mkdir -p doc/dev
          mv dev/bench doc/dev/bench
          rmdir dev 2>/dev/null || true
          echo "embedded dev/bench into the doc artifact:"
          ls doc/dev/bench

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: doc

      - name: Publish summary
        if: always()
        run: |
          {
            echo "# Doc Summary"
            echo "- Docs build: ${{ job.status == 'success' && '✅ passed' || '❌ failed' }}"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-gh-pages:
    needs: [doc]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write      # deploy to GitHub Pages
      id-token: write   # deploy to GitHub Pages
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  report:
    # Post a `ci/doc` status for push runs (no native badge for the doc
    # pipeline on the commit). `if: always()` so a failed build still flips
    # pending -> failure.
    needs: [doc, deploy-gh-pages]
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      statuses: write
    timeout-minutes: 10
    steps:
      - name: Report doc status on the commit
        continue-on-error: true
        uses: actions/github-script@v9
        env:
          STATUS_SHA: ${{ github.sha }}
        with:
          retries: 3
          script: |
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;

            const buildResult = '${{ needs.doc.result }}';
            const deployResult = '${{ needs.deploy-gh-pages.result }}';
            // deploy is skipped when docs aren't published -- not a failure.
            const ok = buildResult === 'success' &&
              (deployResult === 'success' || deployResult === 'skipped');

            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: process.env.STATUS_SHA,
              state: ok ? 'success' : 'failure',
              context: 'ci/doc',
              description: ok ? 'Docs CI succeeded' : 'Docs CI failed',
              target_url: runUrl,
            });
